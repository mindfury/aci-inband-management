name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Test
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate example plan
        run: PYTHONPATH=src python -m aci_inband.cli --config examples/config.example.json --plan
