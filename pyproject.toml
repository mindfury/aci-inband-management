[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aci-inband-management"
version = "0.1.0"
description = "Provision Cisco ACI 5.2 in-band management with the Cobra SDK"
requires-python = ">=3.8"
dependencies = ["requests>=2.31,<3"]

[project.scripts]
aci-inband = "aci_inband.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
